<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques | Administration ENSPY</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../public/images/enspy-logo.png">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../public/images/enspy-logo.png" alt="Logo">
            <span>ADMINISTRATION</span>
        </div>

        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i> <span>Tableau de bord</span>
            </a>
            <a href="courses.html" class="nav-item">
                <i class="fas fa-book-open"></i> <span>Mes Cours</span>
            </a>
            <a href="students.html" class="nav-item">
                <i class="fas fa-users"></i> <span>Étudiants</span>
            </a>
            <a href="statistics.html" class="nav-item active">
                <i class="fas fa-chart-pie"></i> <span>Statistiques</span>
            </a>
            <a href="actualites.html" class="nav-item">
                <i class="fas fa-newspaper"></i> <span>Actualités</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i> <span>Paramètres</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-card">
                <img src="https://ui-avatars.com/api/?name=Admin&background=111827&color=fff" alt="Admin"
                    class="user-avatar" id="sidebarAvatar">
                <div class="user-info">
                    <h4 id="sidebarName">Chargement...</h4>
                    <p>Super Admin</p>
                </div>
                <div class="btn-logout" id="btnLogout" title="Se déconnecter">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP HEADER -->
        <header class="top-header">
            <div class="greeting">
                <h1 id="welcomeTitle">Statistiques</h1>
                <p>Analysez les performances de vos formations.</p>
            </div>
        </header>

        <!-- STATS GRID -->
        <div class="stats-grid" style="margin-bottom: 2rem;">
            <div class="stat-card">
                <div class="stat-content">
                    <h3 id="statTotalStudents">0</h3>
                    <p>Étudiants Uniques</p>
                </div>
                <div class="stat-icon-wrapper bg-blue-soft">
                    <i class="fas fa-users"></i>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-content">
                    <h3 id="statPending">0</h3>
                    <p>Inscriptions en Attente</p>
                </div>
                <div class="stat-icon-wrapper bg-orange-soft">
                    <i class="fas fa-clock"></i>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-content">
                    <h3 id="statTotal">0</h3>
                    <p>Total Inscriptions</p>
                </div>
                <div class="stat-icon-wrapper bg-green-soft">
                    <i class="fas fa-file-signature"></i>
                </div>
            </div>
        </div>

        <!-- CHARTS SECTION -->
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; margin-bottom: 2rem;">

            <!-- Pie Chart -->
            <div
                style="background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                <h3 style="margin-bottom: 1rem; color: #111827;">Répartition des Status</h3>
                <div style="height: 300px; display: flex; align-items: center; justify-content: center;">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <!-- Bar Chart -->
            <div
                style="background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                <h3 style="margin-bottom: 1rem; color: #111827;">Top 5 Cours Populaires</h3>
                <div style="height: 300px;">
                    <canvas id="coursesChart"></canvas>
                </div>
            </div>

        </div>

    </main>

    <script type="module" src="../src/views/admin/statistics.js"></script>
</body>

</html>
