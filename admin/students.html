<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étudiants | Administration ENSPY</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../public/images/enspy-logo.png">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../public/images/enspy-logo.png" alt="Logo">
            <span>ADMINISTRATION</span>
        </div>

        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i> <span>Tableau de bord</span>
            </a>
            <a href="courses.html" class="nav-item">
                <i class="fas fa-book-open"></i> <span>Mes Cours</span>
            </a>
            <a href="students.html" class="nav-item active">
                <i class="fas fa-users"></i> <span>Étudiants</span>
            </a>
            <a href="statistics.html" class="nav-item">
                <i class="fas fa-chart-pie"></i> <span>Statistiques</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i> <span>Paramètres</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-card">
                <img src="https://ui-avatars.com/api/?name=Admin&background=111827&color=fff" alt="Admin"
                    class="user-avatar" id="sidebarAvatar">
                <div class="user-info">
                    <h4 id="sidebarName">Chargement...</h4>
                    <p>Super Admin</p>
                </div>
                <div class="btn-logout" id="btnLogout" title="Se déconnecter">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP HEADER -->
        <header class="top-header">
            <div class="greeting">
                <h1 id="welcomeTitle">Gestion des Étudiants</h1>
                <p>Suivez les inscriptions et les progrès de vos apprenants.</p>
            </div>

            <div class="header-actions">
                <div class="search-box">
                    <i class="fas fa-search" style="color: #9CA3AF"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher par nom, email...">
                </div>

                <div class="icon-btn">
                    <div class="notification-dot"></div>
                    <i class="far fa-bell"></i>
                </div>
            </div>
        </header>

        <!-- STUDENTS LIST -->
        <div class="section-header">
            <div class="section-title">
                Liste des Inscrits
                <span class="badge badge-published" id="totalStudentsBadge"
                    style="font-size: 0.8rem; margin-left: 10px;">0</span>
            </div>
        </div>

        <div class="table-container" id="studentsContainer">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Étudiant</th>
                        <th>Email</th>
                        <th>Cours Inscrit</th>
                        <th>Date d'inscription</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="studentsList">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:40px; color:#9CA3AF;">
                            <i class="fas fa-spinner fa-spin"></i> Chargement des données...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script type="module" src="../src/views/admin/students.js"></script>
</body>

</html>
