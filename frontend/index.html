<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ENSPY Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="public/images/enspy-logo.png">
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="public/images/enspy-logo.png" alt="ENSPY" class="sidebar-logo">
                <span class="sidebar-title">Polytech Portal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <span>Tableau de bord</span>
                </a>
                <a href="#" class="nav-item">
                    <span>Explorer les cours</span>
                </a>
                <a href="#" class="nav-item">
                    <span>Mes inscriptions</span>
                </a>
                <a href="#" class="nav-item">
                    <span>Paramètres</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">
            <header class="header">
                <div class="header-search">
                    <!-- Search could go here -->
                </div>
                <div class="header-user">
                    <button class="btn-primary" id="loginBtn">Se connecter</button>
                    <div id="userProfile" style="display: none;" class="flex items-center gap-md">
                        <span id="userName">Utilisateur</span>
                        <img src="https://ui-avatars.com/api/?name=User&background=FF6B00&color=fff" alt="Avatar"
                            style="width: 32px; border-radius: 50%;">
                    </div>
                </div>
            </header>

            <div class="content">
                <!-- Hero Section style replica -->
                <section class="hero fade-in">
                    <h1>Maîtrisez votre avenir académique</h1>
                    <p>Accédez aux cours officiels de l'École Nationale Supérieure Polytechnique de Yaoundé.</p>
                </section>

                <!-- Dynamic Courses Section -->
                <section class="section">
                    <div class="section-header">
                        <h2 class="section-title">Cours recommandés</h2>
                        <a href="#" style="color: var(--primary-500); font-weight: 500;">Voir tout</a>
                    </div>

                    <div id="coursesGrid" class="course-grid">
                        <!-- Courses will be injected here -->
                        <div class="loading-placeholder" style="grid-column: 1/-1; text-align: center; padding: 2rem;">
                            <p style="color: var(--text-tertiary);">Chargement des cours depuis la base de données...
                            </p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modules for services -->
    <script type="module" src="src/services/api.js"></script>
    <script type="module" src="src/services/courseService.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
