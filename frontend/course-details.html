<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Cours | ENSPY TRAINING</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="public/images/enspy-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div id="loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <img src="public/images/enspy-logo.png" alt="Logo ENSPY">
                <span class="brand-name">ENSPY <span class="brand-highlight">TRAINING</span></span>
            </a>

            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
                <li><a href="catalog.html" class="nav-link active">Cours</a></li>
                <li><a href="#" class="nav-link">Formateurs</a></li>
                <li><a href="#" class="nav-link">À propos</a></li>
            </ul>
        </div>
    </nav>

    <!-- Course Hero -->
    <header class="course-hero" id="courseHero">
        <!-- Injected via JS -->
    </header>

    <!-- Main Content -->
    <div class="container course-layout">
        <!-- Left Column: Content -->
        <main class="course-main">
            <section class="course-section">
                <h2>À propos de ce cours</h2>
                <div id="courseDescription" class="course-description">
                    <!-- Injected via JS -->
                </div>
            </section>

            <section class="course-section">
                <h2>Ce que vous allez apprendre</h2>
                <ul id="courseSyllabus" class="syllabus-list">
                    <!-- Injected via JS -->
                </ul>
            </section>

            <section class="course-section">
                <h2>Équipe Pédagogique</h2>
                <div id="courseInstructor" class="instructor-card">
                    <!-- Injected via JS -->
                </div>
            </section>
        </main>

        <!-- Right Column: Sticky Sidebar -->
        <aside class="course-sidebar">
            <div class="sidebar-card sticky-card" id="enrollmentCard">
                <!-- Injected via JS -->
            </div>
        </aside>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <div class="footer-logo">
                        <a href="#" class="brand">
                            <img src="public/images/enspy-logo.png" alt="Logo ENSPY">
                            <span class="brand-name">ENSPY <span class="brand-highlight">TRAINING</span></span>
                        </a>
                    </div>
                </div>
                <div class="footer-links">
                    <a href="login.html" class="btn-admin">Administrer un cours</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2026 ENSPY Training. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
</body>

</html>
